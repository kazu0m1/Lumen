name: Bootstrap Lumen source

on:
  push:
    branches:
      - main
    paths:
      - bootstrap/**
      - .github/workflows/bootstrap-source.yml

permissions:
  contents: write

jobs:
  bootstrap:
    if: startsWith(github.event.head_commit.message, 'Bootstrap Lumen source')
    runs-on: windows-latest

    steps:
      - name: Checkout bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source package
        shell: pwsh
        run: |
          $parts = Get-ChildItem "bootstrap\part-*.txt" | Sort-Object Name
          if ($parts.Count -ne 6) { throw "Expected 6 bootstrap parts; found $($parts.Count)." }

          $base64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes("bootstrap\source.zip", [Convert]::FromBase64String($base64))

          $hash = (Get-FileHash -Algorithm SHA256 "bootstrap\source.zip").Hash.ToLowerInvariant()
          if ($hash -ne "18dfb7a7a0bda41009302ee4ae89ed548ee656e0fa1994d4e5d9e0f260cc242e") {
            throw "Bootstrap source SHA-256 mismatch: $hash"
          }

          Expand-Archive -Path "bootstrap\source.zip" -DestinationPath "bootstrap\expanded" -Force
          $src = "bootstrap\expanded\Lumen-GitHub-v1.0.4"
          if (-not (Test-Path "$src\Source\MainWindow.cs")) { throw "Expected source tree not found." }
          if (-not (Test-Path "$src\Lumen.csproj")) { throw "Lumen.csproj not found." }

          Get-ChildItem $src -Force | Where-Object { $_.Name -ne ".github" } | ForEach-Object {
            Copy-Item $_.FullName -Destination "." -Recurse -Force
          }

          Remove-Item -Recurse -Force "bootstrap"

      - name: Commit verified source tree
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare Lumen v1.0.4 source"
          git push origin HEAD:main
